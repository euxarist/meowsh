[package]
name = "meowsh"
version = "0.1.0"
edition = "2021"
license = "Unlicense"

[dependencies]
libc = "0.2"
rustyline = "19"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
tempfile = "3.27.0"

# rustyline 19.0.0 with its terminal reads changed: a byte at a time, and CR
# and NL swapped as zsh does,
# so input typed ahead stays there for the command that runs next.
[patch.crates-io]
rustyline = { path = "vendor/rustyline" }
